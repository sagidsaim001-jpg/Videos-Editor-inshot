name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "repo-fix.zip"
      - ".github/workflows/build-apk.yml"
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify uploaded ZIP and integrate editor HTML
        shell: bash
        run: |
          set -euo pipefail
          test -f repo-fix.zip
          unzip -t repo-fix.zip
          mkdir -p .zip-check
          unzip -q repo-fix.zip -d .zip-check
          HTML_FILE="$(find .zip-check -type f -path '*/app/src/main/assets/index.html' -print -quit)"
          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: index.html was not found inside repo-fix.zip"
            find .zip-check -maxdepth 7 -type f -print
            exit 1
          fi
          mkdir -p app/src/main/assets
          cp "$HTML_FILE" app/src/main/assets/index.html
          test -s app/src/main/assets/index.html
          echo "Integrated editor HTML from: $HTML_FILE"
          echo "HTML size: $(wc -c < app/src/main/assets/index.html) bytes"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Videos-Editor-inshot-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
