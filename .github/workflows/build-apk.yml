name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "clipshot-android.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract original project
        shell: bash
        run: |
          test -f clipshot-android.zip
          unzip -t clipshot-android.zip
          mkdir app-source
          unzip -q clipshot-android.zip -d app-source
          test -f app-source/settings.gradle.kts
          test -f app-source/app/src/main/assets/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle -p app-source assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Videos-Editor-inshot-debug-apk
          path: app-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
